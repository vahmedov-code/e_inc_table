[platformio]
default_envs = esp32-m075-v3

[env:esp32-m075-v3]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@7.3.1
  adafruit/Adafruit GFX Library@1.12.1
  adafruit/Adafruit BusIO@1.17.4
  olikraus/U8g2@2.36.5
  olikraus/U8g2_for_Adafruit_GFX@1.8.0
extra_scripts = pre:scripts/embed_web.py
build_unflags = -std=gnu++11
build_flags = -DCORE_DEBUG_LEVEL=0 -std=gnu++17

; Same firmware with larger app slots (partitions-big.csv). Changing the partition table
; needs one USB install; afterwards the usual updates over Wi-Fi or from the CRM continue.
[env:esp32-m075-v3-big]
extends = env:esp32-m075-v3
board_build.partitions = partitions-big.csv

; Diagnostic firmware: AP only; no display task, SPI, framebuffer or FS mount.
[env:esp32-m075-recovery]
extends = env:esp32-m075-v3
build_flags = ${env:esp32-m075-v3.build_flags} -DAVIOR_RECOVERY=1

; Next isolation step: permits office Wi-Fi setup; still no display or FS mount.
[env:esp32-m075-recovery-wifi]
extends = env:esp32-m075-recovery
build_flags = ${env:esp32-m075-recovery.build_flags} -DAVIOR_RECOVERY_WIFI=1
