name: Build AviorSign
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install platformio==6.1.18
      - run: python -m platformio run
      - run: python -m platformio run -e esp32-m075-recovery
      - run: python -m platformio run -e esp32-m075-recovery-wifi
      - run: g++ -std=c++17 -Wall -I include -I .pio/libdeps/esp32-m075-v3/ArduinoJson/src tools/test_schedule.cpp -o .pio/test_schedule && .pio/test_schedule
      - run: python tools/check_project.py
      - run: npm install --prefix .pio/ui-tests --no-audit --no-fund jsdom@26.1.0 @napi-rs/canvas@0.1.80
      - run: node tools/test_ui.cjs
